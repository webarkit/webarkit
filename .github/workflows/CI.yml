name: CI
on:
    - push
    - pull_request

jobs:
    build-and-test:
        runs-on: ubuntu-24.04

        # One job for both workspaces, deliberately not a matrix: the root
        # scripts already build @webarkit/cv-backend-spec before
        # @webarkit/cv-backend-jsfeatnext (which depends on it), and a matrix
        # running the two packages independently risks reintroducing that
        # ordering as a race - npm's own default (alphabetical) workspace
        # build order broke it once already, see 109caaf.
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"

            - name: Get npm cache directory
              id: npm-cache-dir
              shell: bash
              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - uses: actions/cache@v6
              id: npm-cache
              with:
                  path: ${{ steps.npm-cache-dir.outputs.dir }}
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install
              run: npm ci

            # Before the build, so a formatting-only failure is reported in
            # seconds rather than after the whole toolchain has run. Scope is
            # src/, test/, bin/ and scripts/ - deliberately not Markdown or
            # examples/, see the Conventions section of AGENTS.md.
            - name: Format check
              run: npm run format:check

            # Builds cv-backend-spec then cv-backend-jsfeatnext, in that order
            # (see the job comment above) - cv-backend-jsfeatnext's own build
            # step type-checks against the spec's freshly-built dist/, so this
            # also catches the two packages drifting out of sync with each
            # other, not just internal errors in either one alone.
            - name: Build
              run: npm run build

            # Separate from build: tsc -p tsconfig.json (the build step) only
            # type-checks src/, since that's what's actually published: a real
            # type error confined to test/ would pass a build-only check
            # silently. tsconfig.test.json in each package widens the program
            # to include test/ too.
            - name: Type check (src + test)
              run: npm run typecheck

            - name: Test
              run: npm run test

    contract-sync:
        runs-on: ubuntu-24.04

        # Its own job, and not a step inside either of the others, because the
        # thing it checks belongs to neither toolchain: `known.rs` transcribes
        # the contract's DescriptorKind and DescriptorNorm unions by hand, and
        # nothing links the two - no codegen, no shared schema, no test. A
        # member present in one list and missing from the other makes one codec
        # warn about and drop a descriptor set the other accepts, on a .wnft
        # file no fixture contains, so both suites stay green while the codecs
        # disagree. This is the seam between them, so it gets its own job.
        #
        # It reads source text and builds nothing, so it needs no Rust
        # toolchain and no npm install - which is also why it can run in
        # seconds and fail before either real job has finished installing.
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"

            - name: Contract, TypeScript codec and Rust codec agree
              run: npm run check:contract

    rust:
        runs-on: ubuntu-24.04

        # Separate from build-and-test, deliberately: the two toolchains share
        # the repository and the fixtures/ corpus and nothing else, so they have
        # no ordering between them and running them in parallel costs nothing.
        # `crates/wnft-format` consumes the corpus the TypeScript generator
        # produces (fixtures/nft-target/README.md) but does not build it, so it
        # needs no Node step.
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install the Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
                  # The no_std build below needs a bare-metal target, which is
                  # the only way to prove the crate really is no_std: a crate
                  # that accidentally depends on std still builds for the host
                  # with --no-default-features, because the host std is there.
                  targets: thumbv7em-none-eabihf

            - uses: Swatinem/rust-cache@v2

            - name: Format
              run: cargo fmt --all --check

            - name: Clippy
              # --all-targets so that the test suites are linted too: they are
              # where an `unwrap` on file-supplied data is most likely to slip in.
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace

            - name: Build for a no_std target
              run: cargo build -p wnft-format --no-default-features --target thumbv7em-none-eabihf
